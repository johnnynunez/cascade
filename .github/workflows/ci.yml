name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # The framework claims to run on whatever box is available -- x86 servers,
    # Jetson-class aarch64, Apple Silicon laptops -- so CI proves it on all
    # three architectures rather than asserting it in the README. `pin`,
    # `mujoco` and `pyserial` all publish wheels for these three, so the whole
    # matrix runs the same extras.
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # kinematics (pin) unskips the FK/IK, SO-101, orchestrator-e2e,
      # mcp-server and streaming tests. arm-feetech and sim are tiny and make
      # the serial + MuJoCo backends importable. sim-warp adds the MuJoCo Warp
      # runtime so the `engine=warp` tests actually STEP (on Warp's CPU
      # fallback here -- there is no GPU on the runners, which is exactly the
      # portability claim under test). `grasping` adds the GraspGen-X wire so
      # that path is exercised against the protocol stub instead of silently
      # skipping: it is the DEFAULT grasp backend, and without the extra the
      # client cannot even be built. The heavy extras (perception/arm) stay
      # hardware-only. grasp-safety supplies the host geometry dependency for
      # the observed-finger collision tests on each architecture.
      - run: uv sync --extra dev --extra kinematics --extra arm-feetech --extra sim --extra sim-warp --extra grasping --extra grasp-safety --extra conversation
      - name: install and verify pinned kitchen release without a simulator
        run: uv run python scripts/kitchen_assets.py
      - run: uv run pytest tests/ deploy/brev/tests/test_public_visitor.py deploy/brev/tests/test_visitor_video.py -q
      - name: verify offline kitchen packaging and portable bundle admission
        run: uv run pytest deploy/brev/tests/test_build_bundle.py deploy/brev/tests/test_prepare_bundle.py -q

  booth-ui:
    name: booth pages and camera extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: check camera controls and page behavior
        run: >-
          node --test extensions/chrome/tests/*.test.mjs
          extensions/firefox/tests/*.test.mjs
          deploy/runtime/tests/*.cjs deploy/runtime/tests/*.mjs
          deploy/brev/tests/*.cjs deploy/brev/tests/*.mjs

  # Guards the offline story: a run needs base deps + kinematics and NOTHING
  # else -- no torch, no ultralytics, no simulator, no serial port, no
  # accelerator. If one of those imports creeps into a default code path, every
  # "try it without the robot" instruction in the docs quietly stops working on
  # a fresh clone. (pinocchio IS required: FK/IK back the safety layer, so the
  # kinematics extra is part of a minimal install, not an optional add-on.)
  minimal-install:
    name: minimal install, no accelerator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra kinematics
      - name: optional stacks must be absent
        run: |
          for mod in torch ultralytics mujoco mujoco_warp warp serial openai zmq msgpack; do
            if uv run python -c "import $mod" 2>/dev/null; then
              echo "$mod is installed; this job no longer proves anything"; exit 1
            fi
            echo "ok: no $mod"
          done
      - name: mock CLI wiring preserves independent task verdicts
        # The static mock image cannot verify a physical pick-and-place. Check
        # full execution + an honest negative verdict, and a read-only success.
        run: uv run python -m pytest tests/test_minimal_install_smoke.py -q
