# Simulated reBot RS in Isaac Sim via scripts/isaac_bridge.py.
# Same USD model/kinematics/safety as the real arm: whatever works here
# transfers to hardware by swapping the profile back to rebot_rs.
type: isaac
bridge_host: 127.0.0.1
bridge_port: 8611
# Exact articulation identity advertised by the bridge's capture snapshot.
# Custom --prim deployments must bind their own value; never borrow another arm's q.
bridge_robot_id: /tn__00armrs_asmv3_hJ6D/Geometry/base_link
n_joints: 6
settle_tol: 0.045
# Motion and settling durations are seconds of authoritative simulation.
# Fresh q must stay within the existing 1 mrad route-rebind drift bound
# for this physical window; repeated/paused frames cannot establish it.
settle_hold_s: 0.1
settle_timeout_s: 6.0
# Independent wall limits, including transport lock and RPC waits. Slow
# rendering cannot silently change the motion clock or remove this budget.
motion_wall_timeout_s: 120.0
motion_rpc_timeout_s: 1.0
# Actuator targets use 30 Hz nominal sampling; safety retains the exact
# legacy 50 Hz samples plus every actual target and intervening subedge.
motion_rate_hz: 30.0
model: ${assets}/urdf/00-arm-rs_asm-v3/urdf/00-arm-rs_asm-v3.urdf
# Assets are mirrored vs. the SDK/hardware convention (q_local = -q_asset).
joint_signs: [-1, -1, -1, -1, -1, -1]
ee_frame: gripper_end
# Elbow raised; gripper_end +X points forward and +Y opens the jaws.
# A 0.75 rad joint5 offset yaws the gripper sideways by 43 degrees here.
home_q: [0.0, 1.2, 1.2, 0.0, 0.0, 0.0]
handover_q: [0.5, 1.2, 1.2, 0.0, 0.75, 0.0]

gripper:
  # The bridge speaks gripper FRACTION (0 = fingers together, 1 = fully
  # open); it maps to the two prismatic finger joints' limit ranges.
  open_pos: 1.0
  closed_pos: 0.0
  max_width_m: 0.09
  # B36: once the jaws stall on an object, hold at the contact width minus this
  # fraction of travel, the sim analogue of the real driver's bounded squeeze
  # after contact (B38). The bridge drops `effort`, so without it the stage-2
  # position target squeezes the cube at full drive stiffness and leaves wrist
  # roll a median 0.045 rad off its lift target on PhysX (settle_tol 0.045;
  # 0.012 with the hold; Newton shows no such deflection). Only the
  # grasp's close holds; the air-grasp check then judges the hold opening.
  # Keyed by the engine the bridge names in its ping reply: on the bare scene
  # (fresh stage per run, GraspGen-X grasps) PhysX confirmed 11/12 picks with
  # it vs 5/12 without; Newton 1/4 with it vs 12/12 without (the cube dropped
  # in the carry), so Newton keeps the plain two-stage close.
  # docs/evidence/b36-pick-reliability-20261010/README.md
  hold_squeeze_frac:
    physx: 0.05
