# Simulated reBot RS in Isaac Sim via scripts/isaac_bridge.py.
# Same USD model/kinematics/safety as the real arm: whatever works here
# transfers to hardware by swapping the profile back to rebot_rs.
type: isaac
bridge_host: 127.0.0.1
bridge_port: 8611
n_joints: 6
settle_tol: 0.045
model: ${assets}/usd/RS-rebot-dev-arm/00-arm-rs_asm-v3.usda
ee_frame: gripper_end
home_q: [0.0, 1.2, 1.2, 0.0, 0.75, 0.0]
handover_q: [0.5, 1.2, 1.2, 0.0, 0.75, 0.0]

gripper:
  # The bridge speaks gripper FRACTION (0 = fingers together, 1 = fully
  # open); it maps to the two prismatic finger joints' limit ranges.
  open_pos: 1.0
  closed_pos: 0.0
  max_width_m: 0.09
