# Kinematic mock arm on the RS model (ships in assets/; the USD twin that
# Newton/Isaac Sim loads is kept kinematically identical by test_usd_model).
type: mock
model: ${assets}/urdf/00-arm-rs_asm-v3/urdf/00-arm-rs_asm-v3.urdf
# Assets are authored in the mirrored joint convention; SDK/hardware and all
# q constants in this repo are local (q_local = -q_asset). Baked in at load.
joint_signs: [-1, -1, -1, -1, -1, -1]
ee_frame: gripper_end
n_joints: 6
home_q: [0.0, 1.2, 1.2, 0.0, 0.75, 0.0]
# Present-to-human pose: home leaned toward the operator's side. Was a
# hardcoded default inside skill_handover; moved here because a keyframe for
# one arm is not a keyframe for another.
handover_q: [0.5, 1.2, 1.2, 0.0, 0.75, 0.0]

gripper:
  open_pos: 0.0
  closed_pos: 1.0
  max_width_m: 0.09
