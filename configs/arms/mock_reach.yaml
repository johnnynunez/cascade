# Kinematic mock arm with the measured reach envelope (B45, opt-in): the
# `mock` profile plus the study's angled approaches and workspace box --
# exactly the block in arms/rebot_rs_reach.yaml (see there and
# docs/REACH_ENVELOPE.md). Offline rehearsal:
#   python -m cascade.apps.demo --arm mock_reach --task "pick up the red cube"
extends: mock
overrides:
  safety:
    workspace:
      min: [0.10, -0.50, -0.01]
      max: [0.55, 0.50, 0.55]
  grasp:
    angled_approach_tilts_deg: [30, 45, 90]
    # B73: vet each tilted candidate's forearm/wrist/gripper clearance to the
    # table and the observed object (configs/demo.yaml, REACH_ENVELOPE.md).
    angled_clearance_vet: true
