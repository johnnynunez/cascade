# Real reBot DevArm B601, RobStride build, on can0 @ 1 Mbps.
#
# Before first use:
#   sudo ip link set can0 up type can bitrate 1000000
# and make sure motorbridge-gateway / MotorBridge Studio are NOT running
# (host-id 0xFD conflict).
type: rebot_rs
# The SDK lives one directory up from this repo (<repo>/../reBotArm_control_py)
# so the path is portable instead of a dev-box absolute path. Run
# scripts/update_rebot_sdk.sh to clone/pull it into place.
sdk_path: ${repo}/../reBotArm_control_py
hw_yaml: rebotarm_rs.yaml
model: ${assets}/urdf/00-arm-rs_asm-v3/urdf/00-arm-rs_asm-v3.urdf
# Assets are mirrored vs. the SDK/hardware convention (q_local = -q_asset).
joint_signs: [-1, -1, -1, -1, -1, -1]
ee_frame: gripper_end
n_joints: 6
# Forward-facing gripper, matching the Isaac ready pose (joint5 neutral).
home_q: [0.0, 1.2, 1.2, 0.0, 0.0, 0.0]
handover_q: [0.5, 1.2, 1.2, 0.0, 0.75, 0.0]

# MIT gains per joint (null = use the SDK's rebotarm_rs.yaml values).
mit_kp: null
mit_kd: null

gripper:
  # MEASURED on the RS build (scripts/diag_rebot_mb.py): travel runs 0.0 ->
  # +6.39 rad, closed at 0. That is the OPPOSITE polarity to the old DM values
  # (open -6.8), which drove the jaws into the closed hard stop at full effort.
  # open_pos keeps margin off the +6.39 physical end. The arm gains above are
  # inherited from the SDK's rebotarm_rs.yaml, but the gripper KP/KD below are
  # cascade's own and still the conservative RS values -- bump after an onsite
  # grasp check if the jaws need more force.
  open_pos: 6.2
  closed_pos: 0.0
  max_width_m: 0.09
  kp: 6.0
  kd: 0.4
