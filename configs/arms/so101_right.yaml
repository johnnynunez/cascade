# SO-101, RIGHT arm of a two-arm setup (mock backend, no hardware).
#
#   python -m cascade.apps.demo --arms so101_left,so101_right \
#       --task "pick and place the pink object"
#
# Pairs with so101_left.yaml -- read that file's header first: it carries the
# full statement of what the inter-arm check does and does not guarantee
# (segment-to-segment on link centrelines, so link SHAPE is what
# `neighbor_clearance_m` stands in for; SKIPPED for a standby arm with no
# static partition underneath; base_pose is a MEASUREMENT you must take on
# your own table).
extends: so101

type: mock

# This arm is the RIGHT one: -0.22 m along the table's +y axis, so the two
# bases sit 0.44 m apart facing the same direction -- close enough to share a
# band of table (see so101_left.yaml's header for the measured numbers).
base_pose: [0.0, -0.22, 0.0, 0.0, 0.0, 0.0]

gripper:
  open_pos: 0.60
  closed_pos: -0.15
  max_width_m: 0.055

overrides:
  safety:
    # Workspace inherited from so101.yaml: the arms share the table centre on
    # purpose, and the inter-arm gate is what keeps them apart.
    table_z: 0.0
    max_joint_vel: 0.8
    neighbor_clearance_m: 0.05
  grasp:
    topdown_z_max: 0.05
    pregrasp_offset_m: 0.03
    exempt_radius_m: 0.07
    # so101.yaml's own drop zone already sits in this half (r = 0.233).
    drop_zone: [0.20, -0.12]
  workspace_filter:
    base_radius_m: 0.08
    max_extent_m: 0.20
    reach_m: 0.48
