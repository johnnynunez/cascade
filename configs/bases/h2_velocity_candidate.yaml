# Candidate episode profile for the Unitree H2 PhysX owner: explicit verifier
# limits so the first owned episodes can be judged by the independent
# BasePostconditionChecker. NOT admission: every number here is a candidate the
# measured campaign (docs/HUMANOID_H2.md) confirms or replaces; nothing is tuned
# to make an episode pass. Geometry is scaled to a 1 m-pelvis biped; the fall
# criteria are the training terminations (pelvis < 0.615 m, tilt > 30 deg).
extends: h2_velocity_physx
admission: pending_h2_geometric_validation
verifier:
  sample_interval_s: 0.02
  read_timeout_s: 0.5
  # Candidate revision 2 (2026-10-07, docs/evidence/h2-geometric-candidate-20261007):
  # the settle budget is spent in WALL seconds while the H2 needs ~3.5 s of SIM to come to
  # rest after a goal-stopped command (standing decays 0.34 -> 0.04 rad/s over 3.5 s sim;
  # the yaw oscillation after a mid-step stop lasts 2-3 s sim). At this owner's ~0.47x
  # real time 4 s wall covered ~1.9 s sim, so the verdict was taken before the robot could
  # physically settle. 8 s wall ~ 3.8 s sim here; the wall budget and the sample quota are
  # sized to cover command (3 s sim ~ 6.4 s wall) + settle. The rest thresholds below
  # (0.08 m/s, 0.20 rad/s, 0.03 m, 0.05 rad over the last 0.4 s) are unchanged.
  max_wall_duration_s: 20.0
  settle_timeout_s: 8.0
  settle_window_s: 0.4
  min_motion_samples: 5
  min_settle_samples: 3
  max_samples: 1201
  max_history: 30
  max_state_age_s: 0.5
  max_sample_gap_s: 0.15
  max_position_abs_m: 8.0
  max_linear_speed_m_s: 1.5
  max_angular_speed_rad_s: 4.0
  min_height_m: 0.615
  max_tilt_rad: 0.5236
  min_progress_ratio: 0.6
  max_progress_ratio: 1.4
  translation_tolerance_m: 0.05
  rotation_tolerance_rad: 0.05
  max_lateral_drift_m: 0.20
  max_heading_drift_rad: 0.20
  stop_linear_speed_m_s: 0.08
  stop_angular_speed_rad_s: 0.20
  stop_drift_m: 0.03
  stop_drift_rad: 0.05
# Geometric skills, candidate bounds (NOT admission). Derived from the first owned
# episodes of 2026-10-07 (docs/evidence/h2-owner-first-episodes-20261007): a 0.3 m/s
# command tracked ~0.215 m/s (0.645 m in 3 s), so within the unchanged 3 s
# `safety.max_duration_s` a walk_distance can reach ~0.6 m; a 0.5 rad/s turn moved the
# pelvis 0.195 m along its path for 0.875 rad, so the control-side translation veto for
# a turn of up to `max_turn_angle_rad` (1.0) is 0.35 m. The verifier, not these
# bounds, judges success; min_height/max_tilt are the training fall criteria.
capabilities: [walk_velocity, walk_distance, turn, stop_navigation]
distance_control:
  speed_m_s: 0.3
  max_distance_m: 0.6
  tolerance_m: 0.05
  max_lateral_drift_m: 0.20
  max_heading_drift_rad: 0.20
  min_height_m: 0.615
  max_tilt_rad: 0.5236
turn_control:
  max_translation_path_m: 0.35
  min_height_m: 0.615
  max_tilt_rad: 0.5236
  # Candidate revision 3 (B29, 2026-10-07), NOT physically measured yet: decelerate the
  # admitted 0.5 rad/s turn before the goal, closed-loop on the MEASURED yaw (SafeBase:
  # |wz| = max(min_rate, min(previous, sqrt(2*decel*(|remaining| - 0.03 tolerance)))),
  # then the unchanged zero-twist stop) instead of cutting 0.5 rad/s to zero mid-step,
  # which left the 0.8 rad turn of geo3-v2 oscillating 0.69 -> 0.32 rad/s for 3.75 s sim.
  # Needs the H2 owner started with --velocity-scaling (scales the ACTIVE admitted twist
  # by 0 < s <= 1; never re-admits or extends); without it every turn is refused before
  # motion. Values from the geo3-v2 owner rows (docs/evidence/h2-geometric-candidate-20261007):
  #  - min_rate 0.15: the 0.6 rad turn that settled was cut at ~0.26 rad/s (mean 0.1 s yaw
  #    rate over its last 0.3 s), the refuted 0.8 rad turn at ~0.47 rad/s; the floor sits
  #    below both and keeps the robot progressing until the unchanged 0.03 rad tolerance.
  #  - decel 0.4 rad/s^2: 0.5 -> 0.15 rad/s takes 0.875 s, ~4 periods of the measured
  #    ~0.2 s yaw oscillation and ~8x the policy's ~0.11 s response (0.1 s-mean yaw rate at
  #    0.4 rad/s 0.11 s after admission), so the policy sees a ramp, not a step; the longest
  #    admitted turn (1.0 rad) needs ~2.38 s of command, ~2.56 s at the measured 93 %
  #    tracking (0.465 of 0.5 rad/s): inside the unchanged 3 s safety.max_duration_s.
  #  - rate_step 0.025 rad/s (5 % of 0.5): at most 14 in-admission updates per turn, one per
  #    ~0.06 s sim (3 policy ticks) while ramping.
  goal_ramp:
    decel_rad_s2: 0.4
    min_rate_rad_s: 0.15
    rate_step_rad_s: 0.025
    # Candidate revision 4 (B29b, 2026-10-08), NOT physically measured yet. The owner A/B of revision 3
    # (docs/evidence/h2-turn-ramp-live-20261008, 39 turns) measured 0.8 rad 8/8 with the ramp vs 1/6
    # without, but 1.0 rad 1/5 vs 5/6: the policy's yaw rate dips below 0.2 rad/s ~1.0-1.75 s into most
    # turns (both arms), so on a 1.0 rad turn the ramp started only at 2.1-2.24 s and its ~0.8 s
    # deceleration ran past the unchanged 3 s command (3 timeouts). The budget never lets the rate fall
    # below (|remaining| - 0.03) / (tracking * (command time left - reserve_s)), the constant rate that
    # still covers the measured remaining yaw in the ADMITTED time left; inside the reserve the rate is
    # held. It only withholds decelerations (never raises the rate, never extends the command):
    #  - tracking 0.93: the measured 0.465 of 0.5 rad/s (geo3-v2), the same figure revision 3 used.
    #  - reserve_s 0.3 s sim: ~3 policy responses (~0.11 s) / ~6 owner samples of slack for the
    #    zero-twist stop to land inside the command. Replayed on the logged revision-3 ramp updates it
    #    binds on exactly the 3 timed-out +1.0 rad turns, the -1.0 rad turn that came within tolerance
    #    only at 2.90 s, and the last update of one confirmed 0.8 rad turn (budget 0.186 vs the
    #    law's 0.171 rad/s: withheld); every other logged update is unchanged
    #    (tests/test_turn_goal_ramp_budget.py replays it on the committed evidence).
    # Cost, stated: a late turn is cut above the 0.15 floor (up to the admitted 0.5, i.e. revision 2's
    # cut for the 1.0 rad turns that confirmed 5/6 without the ramp). `time_budget: null` in an
    # `extends:` child restores revision 3 for an A/B.
    time_budget:
      reserve_s: 0.3
      tracking: 0.93
