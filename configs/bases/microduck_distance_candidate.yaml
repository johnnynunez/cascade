# Opt-in candidate, NOT physical admission. Never changes microduck_isaac.
# Official VelStand source 8d0db749 documents vx[-.4,.4], wz[-1,1].
# Reference experiments reproduce motion but NOT nominal velocity tracking.
# Commands below are internal policy inputs for measured geometric objectives.
# A separately inspected native identity/support registry and verifier are still
# mandatory. Existing failed walk_velocity evidence remains unchanged.
extends: microduck_isaac
capabilities: [walk_distance, turn, stop_navigation]
admission: pending_geometric_locomotion_admission
safety:
  max_vx: 0.3
  max_wz: 1.0
  turn_speed_rad_s: 1.0
distance_control:
  speed_m_s: 0.3
  max_distance_m: 0.1
  tolerance_m: 0.005
  max_lateral_drift_m: 0.02
  max_heading_drift_rad: 0.08
  min_height_m: 0.06
  max_tilt_rad: 0.5
