# Hand-eye calibration preset poses, per arm (scripts/calibrate_handeye.py).
#
# Each pose is [x, y, z, roll, pitch, yaw]: TCP (the arm profile's ee_frame)
# in the ROBOT BASE frame, metres, URDF rpy (R = Rz(yaw) Ry(pitch) Rx(roll),
# cascade.types.pose_to_transform). The calibration CLI solves IK for each
# from the profile's home_q, vets it with the arm's SafetyHarness, orders the
# sweep greedily in joint space, and vets every pose AGAIN right before the
# arm moves through SafeArm. Unreachable/vetoed presets are skipped, never
# forced.
#
# `arms:` maps an arm profile to a set EXPLICITLY. A new arm gets an entry
# only after its reachability is measured (tests/test_handeye_presets.py
# pins the reBot sets on the RS kinematics: >= 90 % usable, rotation spread
# >= 1.5x the solver's degeneracy gate, largest joint move < 2 rad).
arms:
  rebot_rs: rebot
  rebot_rs_mb: rebot
  mock: rebot          # the mock arm IS the RS model kinematically (dry runs)

sets:
  rebot:
    # Eye-to-hand (fixed top camera, marker on top of the gripper, face up).
    # Verbatim from Seeed's WRC fork, scripts/calib_top_orbbec.py
    # TOP_CALIB_POSES (itself copied from rebot_grasp/scripts/
    # calibrate_top_camera.py): roll/yaw/pitch sweeps around (0.30, -0.05,
    # 0.28), translations, combined corners and extreme combos. On cascade's
    # RS kinematics 37/38 solve (0.25,-0.05,0.28 rpy 0 does not) and all
    # 37 pass vet_pose; rotation spread ~20 deg.
    eye_to_hand:
      - [ 0.30, -0.05,  0.28,  0.00,  0.00, -0.50]
      - [ 0.30, -0.05,  0.28,  0.00,  0.00,  0.00]
      - [ 0.30, -0.05,  0.28,  0.00,  0.00,  0.50]
      - [ 0.30, -0.05,  0.28, -0.60,  0.00,  0.00]
      - [ 0.30, -0.05,  0.28, -0.30,  0.00,  0.00]
