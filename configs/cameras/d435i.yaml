type: realsense
width: 1280
height: 720
# 1280x720 RGB at 30 FPS is unavailable on the current USB 2.1 connection.
# 15 FPS is advertised by both RGB and depth; depth is aligned to RGB.
fps: 15
min_depth_m: 0.15
max_depth_m: 2.0
warmup_frames: 15

extrinsics:
  mode: eye_in_hand
  # RGB optical pose in the gripper frame, for the 3D-printed Franka Hand mount.
  # Depth is aligned to RGB and backprojected with RGB intrinsics.
  # T maps RGB optical coordinates to gripper coordinates: p_gripper = T @ p_RGB.
  # T_base_camera = T_base_gripper @ T; the reverse mapping uses inverse(T).
  # This matrix is the single source of camera mounting calibration.
  # Reference: fr3_hand_tcp at the fingertip center; translation in meters.
  # Operator measurements (2026-10-09): +30 mm TCP X, -35 mm TCP Z (toward wrist).
  # Assumes the camera's central mounting-screw line is at TCP Y=0.
  # D400 datasheet 337029-009, Figure 10-8, p.113: left IR is 17.5 mm
  # from that line; RGB is another 15 mm outward. RGB is therefore at
  # optical X=-32.5 mm relative to that line, mapped by R below to TCP Y=-32.5 mm.
  # https://www.realsenseai.com/wp-content/uploads/2020/06/Intel-RealSense-D400-Series-Datasheet-June-2020.pdf#page=113
  # Include this offset ONCE here; no extra depth-to-RGB or grasp-target offset.
  # Optical +z follows the fingers (hand +Z).
  # Camera roll verified against aligned depth/table normal and stationary
  # FR3 FK (2026-10-01): optical +x (image right) -> hand +Y,
  # optical +y (image down) -> hand -X.
  T:
    - [ 0.0, -1.0,  0.0, 0.030]
    - [ 1.0,  0.0,  0.0, -0.0325]
    - [ 0.0,  0.0,  1.0, -0.035]
    - [ 0.0,  0.0,  0.0, 1.000]
