# Intel RealSense D455F, eye-to-hand (static scene/overhead) unit.
#
# Identical hardware to d455f_wrist.yaml, so the serial below is what makes
# the selection deterministic: with two D455F attached, a profile without a
# serial binds to whichever unit librealsense enumerates first, which is
# arbitrary and can flip between boots.
#
# Firmware 5.17.0.10 (updated 2026-08-15). width/height select COLOR;
# the backend lets librealsense choose native depth, then aligns it to color.
# This mounting was collected at depth 848x480 / color 1280x720, both 30 fps.
# min_depth_m still rejects unreliable close-range data; do not lower it
# to recover cropped/invalid arm points during calibration.
type: realsense
serial: "261522301814"
width: 1280
height: 720
fps: 30
min_depth_m: 0.4
max_depth_m: 4.0
warmup_frames: 15

extrinsics:
  mode: eye_to_hand
  # Fixed-camera calibration for this rig. Recalibrate after any mount change
  # (marker on top of the gripper, docs/HANDEYE_CALIBRATION.md):
  #   python scripts/calibrate_handeye.py --camera d455f_scene --arm rebot_rs
  # or markerless (no marker: the arm's meshes fitted in depth; this T is
  # the starting guess):
  #   python scripts/calibrate_handeye.py --camera d455f_scene --arm rebot_rs --method markerless
  # then enable the record (it takes precedence over T below; a missing or
  # rejected record turns 3D fusion OFF for this camera rather than fall back):
  # Accepted on THIS fixed mounting, 2026-10-12: native markerless sweep,
  # 21/21 preselected observable poses; 70.6% inliers, RMSE 3.1 mm,
  # maximum per-pose disagreement 0.81 deg. No post-fit sample exclusions.
  # Moving either the camera mount or robot base invalidates this record.
  # The accepted record overrides the rough starting T below.
  hand_eye_json: ${repo}/configs/calib/d455f_scene_rebot_rs.handeye.json
  # ROUGH START ONLY: current fixed mounting after repositioning/re-aiming.
  # Read-only RGB-D and joint capture 2026-10-12 19:01; table plane gives
  # 46.1 cm height, matching the operator's 45-46 cm lens-centre measurement.
  # Four single-pose refinements agree: (0.311, -0.567, 0.465) m in base,
  # explaining 74.7% of the visible arm. This is NOT an accepted calibration.
  # The supervised sweep's accepted result is in hand_eye_json above.
  T:
    - [ 0.99676, -0.05288, -0.06054,  0.31097]
    - [ 0.02148, -0.55047,  0.83458, -0.56678]
    - [-0.07746, -0.83318, -0.54756,  0.46483]
    - [ 0.00000,  0.00000,  0.00000,  1.00000]
  # Runtime extrinsic drift monitor (docs/HANDEYE_CALIBRATION.md): while the
  # arm is static, checks that depth still matches the arm at FK through
  # this extrinsic; after `consecutive` checks off by more than max_offset_m
  # (RMS of the visible arm surface) or max_rot_deg, 3D fusion for this
  # camera stops and a passive re-calibration candidate is proposed in the
  # run dir. Read-only on the arm. Opt-in; applying a candidate is opt-in too.
  drift_monitor:
    enabled: false
    period_s: 5.0
    max_offset_m: 0.010
    max_rot_deg: 3.0
    consecutive: 3
    auto_apply: false
