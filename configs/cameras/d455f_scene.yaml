# Intel RealSense D455F, eye-to-hand (static scene/overhead) unit.
#
# Identical hardware to d455f_wrist.yaml, so the serial below is what makes
# the selection deterministic: with two D455F attached, a profile without a
# serial binds to whichever unit librealsense enumerates first, which is
# arbitrary and can flip between boots.
#
# Firmware 5.17.0.10 (updated 2026-08-15). Min depth ~0.52 m at 1280x720 --
# keep the tripod far enough back; below it depth returns 0 (invalid).
type: realsense
serial: "261522301814"
width: 1280
height: 720
fps: 30
min_depth_m: 0.4
max_depth_m: 4.0
warmup_frames: 15

extrinsics:
  mode: eye_to_hand
  # PLACEHOLDER T_cam2base copied from d455f.yaml. Calibrate on the rig
  # (marker on top of the gripper, docs/HANDEYE_CALIBRATION.md):
  #   python scripts/calibrate_handeye.py --camera d455f_scene --arm rebot_rs
  # or markerless (no marker: the arm's meshes fitted in depth; this T is
  # the starting guess):
  #   python scripts/calibrate_handeye.py --camera d455f_scene --arm rebot_rs --method markerless
  # then enable the record (it takes precedence over T below; a missing or
  # rejected record turns 3D fusion OFF for this camera rather than fall back):
  # Calibrated on THIS rig 2026-10-11 (markerless, 37/37 poses, rmse 3.3 mm):
  hand_eye_json: ${repo}/configs/calib/d455f_scene_rebot_rs.handeye.json
  # ROUGH starting guess on THIS rig (2026-10-10), not a calibration: tape
  # measurements (camera ~48 cm up, on the far edge of the table, looking back
  # at the arm) + the table plane in depth + a single-view fit of the arm at
  # rest (explains 74 % of the visible arm). Refine with --method markerless.
  T:
    - [-0.99151,  0.12855, -0.01949,  0.23383]
    - [ 0.06771,  0.38250, -0.92147,  0.54274]
    - [-0.11100, -0.91497, -0.38796,  0.46806]
    - [ 0.00000,  0.00000,  0.00000,  1.00000]
  # Runtime extrinsic drift monitor (docs/HANDEYE_CALIBRATION.md): while the
  # arm is static, checks that depth still matches the arm at FK through
  # this extrinsic; after `consecutive` checks off by more than max_offset_m
  # (RMS of the visible arm surface) or max_rot_deg, 3D fusion for this
  # camera stops and a passive re-calibration candidate is proposed in the
  # run dir. Read-only on the arm. Opt-in; applying a candidate is opt-in too.
  drift_monitor:
    enabled: false
    period_s: 5.0
    max_offset_m: 0.010
    max_rot_deg: 3.0
    consecutive: 3
    auto_apply: false
