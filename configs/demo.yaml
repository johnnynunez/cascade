# Main demo configuration. Camera/arm/llm profiles are merged in at load
# time (see cascade.config.load_demo_config).

safety:
  # Base-frame workspace AABB for the TCP (meters). Verified against the RS
  # URDF top-down IK reachability probe (x 0.15..0.45, y +-0.25). MEASURED
  # 2026-10-09 (scripts/reachability_study.py, docs/REACH_ENVELOPE.md): with
  # the runtime's own IK seed and harness vet, top-down grasps reach only
  # r <= 0.45 m from the base at 2 cm grasp height (0.38 m at 10 cm), so the
  # far corners of this box need an angled approach. Angled approaches reach
  # r ~0.69-0.75 m; the opt-in *_reach arm profiles (rebot_rs_reach,
  # isaac_reach, mock_reach) carry the measured, larger box. Unchanged here.
  workspace:
    min: [0.10, -0.30, -0.01]
    max: [0.50, 0.30, 0.55]
  table_z: 0.0            # table surface height in base frame
  table_clearance: 0.02   # TCP keeps this far above the table outside grasps
  max_joint_vel: 1.2      # rad/s, enforced per streamed waypoint
  joint_margin: 0.02      # rad inside URDF limits
  watchdog_s: 5.0         # halt motion if perception is staler than this
  keep_out: []            # e.g. [{min: [x,y,z], max: [x,y,z]}] for the tripod
  min_clearance_m: 0.03   # TCP/link distance to the occupancy map's obstacles

# Occupancy / distance-field map (perception/occupancy.py). ON by default:
# the harness gains a measured-clearance gate whenever the bridge answers.
# scripts/serve_occupancy.sh runs the bridge (scripts/launch.sh starts it):
#   nvblox  P0 on NVIDIA GPUs -- real nvblox (nvblox_torch) TSDF + ESDF
#   warp    hardware-agnostic default -- TSDF with carving + exact EDT in Warp
#           kernels, CPU on macOS/Linux/aarch64, CUDA on Jetson/x86
#   voxel   numpy fallback (no carving, no distance field)
# `auto` picks nvblox > warp > voxel for THIS machine. The demo probes the
# bridge at startup and prints the backend that answered ("occupancy=warp on
# cpu (1.0 cm voxels, ESDF)" or "none (...)"): a bridge nobody started is
# visible, not silent. Booth rule still applies at every layer -- missing
# client deps (`grasping` extra), a down/slow bridge or a stale cache degrade
# to "no occupancy check" by default. Set required: true for a profile that
# must reject startup/motion without a fresh observed distance map; disabling
# that required map with CASCADE_OCCUPANCY=0 is a configuration error.
occupancy:
  enabled: true
  required: false
  host: 127.0.0.1          # no variable: launch.sh starts this bridge on this machine
  port: 5557               # CASCADE_OCCUPANCY_PORT overrides it (load_demo_config, last)
  timeout_ms: 500          # per ZMQ round trip; refreshed at perception_loop.rate_hz, not per waypoint
  max_age_s: 10.0          # expiry skips an optional map and blocks a required map
  stride: 8                # legacy cloud-protocol subsampling (old bridges)
  depth_stride: 2          # depth-frame subsampling shipped to the bridge (640x480 -> 320x240)
  probe_timeout_ms: 300    # startup probe; a bridge that is up answers in < 5 ms
  # Empty the bridge's map when this runtime starts. The bridge outlives the
  # runtime, so geometry from an earlier session (an arm that moved during
  # teardown, an older body-mask radius) is unmasked here and can refuse the
  # first motion. Off by default: several runtimes may share one bridge.
  clear_on_start: false
  # region_min/region_max: AABB to query for occupied points; defaults to
  # safety.workspace min/max if omitted.

grasp:
  # Grasp planner: "obb" (analytic, always available) or "graspgenx"
  # (learned 6-DoF via the ZMQ server -- scripts/serve_graspgenx.sh on a CUDA
  # box, or scripts/serve_graspgenx_stub.py as a protocol double). The server
  # is probed at startup. Optional profiles report an analytic fallback and
  # retry after a short cooldown. The Spark profile requires the real model:
  # failed startup/inference is an error, with no analytic substitution.
  backend: graspgenx
  graspgenx:
    host: 127.0.0.1         # CASCADE_GRASPGENX_HOST / _PORT override both, applied last by
    port: 5556              # load_demo_config to every arm's view (e.g. a server on a CUDA box)
    gripper: franka_panda   # fallback when `sweep` is removed
    num_grasps: 100
    topk: 32
    min_score: 0.0
    timeout_ms: 8000        # warm inferences (0.09 s measured); the server warms before binding (B15a)
    tip_offset_m: 0.098     # virtual model base -> TCP; applied to BOTH sweep conditioning and returned poses
    # DEFAULT GRIPPER GEOMETRY = the reBot RS parallel jaw, because demo.yaml
    # describes the reference rig. This is a swept volume for cross-embodiment
    # conditioning (frame: origin at the TCP, +Z approach, +X closing),
    # derived from the RS URDF finger geometry (max open 0.09 m, pad
    # ~0.02 x 0.045 m).
    #
    # ANY ARM WITH A DIFFERENT GRIPPER MUST OVERRIDE THIS in its own profile,
    # exactly like `grasp.topdown_z_max` and `grasp.drop_zone` already do.
    # Leaving it inherited asks GraspGen-X to plan for a 90 mm jaw on a robot
    # whose jaw is 55 mm -- it returns grasps too wide to close, and the
    # failure looks like bad model quality rather than a config error.
    # See configs/arms/so101.yaml.
    sweep:
      extents_open: [0.090, 0.020, 0.045]
      # gripper_end lies at the distal fingertip, not halfway up the pad.
      # The URDF finger mesh extends behind it along the approach axis.
      # Centering this volume at zero invents 22.5 mm of finger beyond the
      # real tip and makes the model plan shallow, often empty grasps.
      offset_open: [0.0, 0.0, -0.0225]
      extents_mid: [0.045, 0.020, 0.045]
      offset_mid: [0.0, 0.0, -0.0225]
      gripper_type: 0
      fingertip_depth: 0.0
  # HUG (Human Universal Grasping, arXiv:2606.17054) as an OPT-IN second
  # learned backend (`backend: hug`, or CASCADE_GRASP_BACKEND=hug; the
  # isaac_kitchen_hug profile). It predicts a human hand for one RGB-D frame
  # and a query pixel; CASCADE maps each hand to a parallel-jaw pinch (thumb
  # tip vs index tip -- our assumption, not a HUG output) and ranks by its own
  # geometry (HUG has no score), then the usual outcome-memory re-rank,
  # selector and harness apply. Server: scripts/serve_hug.py in HUG's own
  # environment (CUDA required; `--stub` = analytic protocol double).
  # See docs/HUG.md. These defaults change nothing while `backend` is graspgenx.
  hug:
    host: 127.0.0.1         # CASCADE_HUG_HOST / _PORT override both, applied last by load_demo_config
    port: 5558              # (every arm's view); scripts/serve_hug.py binds CASCADE_HUG_PORT too
    required: true          # fail visibly; never an OBB substitute (false: reported OBB fallback)
    num_samples: 32         # hands per request: N noise draws of ONE query (our batching)
    topk: 32
    timeout_ms: 15000
    probe_timeout_ms: 300
    crop: center            # HUG's documented centre crop; `query` (ours) keeps off-centre objects in view
    pinch_opposition: index # thumb tip vs index tip; `index_middle` = mean of index+middle tips
    pinch_approach: hand    # palm -> pinch; `vertical` keeps the contacts, forces top-down
    approach_z_max: 0.2     # same tabletop rule as graspgenx: no approach from below
    max_lateral_offset_m: 0.03   # pinch centre this far beside the observed object: dropped
    surface_tolerance_m: 0.005   # pinch centre in front of the first object surface: dropped
    max_query_offset_m: 0.02     # query pixel must back-project onto the fix (extrinsic check)
  # Camera-frame mask planner (`backend: camera_frame`, or
  # CASCADE_GRASP_BACKEND=camera_frame) -- OPT-IN, analytic, never a GraspGen-X
  # substitute. Ported from Seeed's WRC fork, which mirrors rebot_grasp's
  # estimate_grasp: minAreaRect on the detection mask, median mask depth
  # back-projected, approach along the CAMERA'S LINE OF SIGHT (a tilted camera
  # no longer biases the grasp), TCP pushed insertion_depth_m into the object.
  # Needs a segmentation mask and measured depth (sensor/mono; plane-cast depth
  # is refused). Candidates go through the same memory re-rank, jaw-width, IK
  # and harness vetting as every backend. See docs/WRC_PERCEPTION_PORT.md.
  # These defaults change nothing while `backend` is graspgenx.
  camera_frame:
    required: false         # true: no mask grasp -> visible error, never OBB
    include_obb: true       # analytic OBB alternates ranked behind the mask grasp
    insertion_depth_m: 0.015  # rebot_grasp default. WRC's rig ran 0.0 because its
                              # hand-eye JSON baked in a 2 cm compensation: tune
                              # together with the camera extrinsics.
    depth_quantile: 0.5     # median depth inside the mask
    finger_drop_m: 0.030    # drop mask pixels this much nearer than the median
                            # (gripper fingers segmented into the object mask)
    max_fix_offset_m: 0.03  # planned surface point must lie within this of the
                            # localized object's box (frame/extrinsic check)
  # NOTE: strict top-down tool poses are only IK-reachable below z~0.15 on
  # the B601-RS (wrist limits); keep grasp_z + offset under that.
  pregrasp_offset_m: 0.04   # hover height above the grasp along -approach.
                            # Kept small: tall (12 cm) blocks are grasped near
                            # z~0.10, and a larger hover pushes the pregrasp
                            # pose above z~0.15 where top-down IK fails on the
                            # B601-RS.
  depth_fraction: 0.15      # grasp this far down from the object's TOP. Low
                            # value = grasp near the top face, which keeps the
                            # gripper fingers (they extend ~5cm below the TCP)
                            # above the table on tall blocks.
  exempt_radius_m: 0.15     # grasp-descent safety cylinder radius. Must
                            # cover the gripper_end link's horizontal offset
                            # from the object center during a top-down
                            # descent, not just the jaw tips -- at 0.07 the
                            # reBot RS wrist link tripped "link 7 would hit
                            # the table" (z=0.009) just OUTSIDE the cylinder.
                            # Only opens during the descent over the target.
  move_duration_s: 2.5
  descend_duration_s: 2.0
  release_height_m: 0.05    # place_at default: this far above the table
  release_clearance_m: 0.06 # place_on_object: drop height above target top
  air_grasp_frac: 0.04      # jaw open-fraction below this after close = missed
  close_settle_s: 0.4       # generic two-stage close dwell (real arm ignores)
                            # real reBot RS squeeze cap: the arm-profile key
                            # gripper.max_contact_squeeze_rad (configs/arms/
                            # rebot_rs*.yaml, null = off; docs/REBOT_GRIP_SQUEEZE_CAP.md)
                            # Isaac grasp hold after contact (B36): the arm-
                            # profile key gripper.hold_squeeze_frac, keyed by
                            # the bridge's physics engine (configs/arms/
                            # isaac.yaml: {physx: 0.05}; unset/null = off)
  drop_zone: [0.18, -0.17]  # pick_and_place default target = the bin, inside
                            # the B601-RS top-down IK envelope (reachable place)
  home_after_place: true    # clear the camera view after each pick_and_place
  topdown_z_max: 0.15       # strict top-down poses are IK-unreachable above
                            # this on the B601-RS (wrist limits)
  # Analytic (OBB) planner: approach tilts (degrees from straight down, in
  # (0, 90]; 90 = horizontal) emitted as extra candidates BEHIND every
  # top-down one, leaning away from the base with the same horizontal jaw
  # axis. [] (default) = top-down only, exactly as before. Opt-in via the
  # *_reach arm profiles ([30, 45, 90], measured: docs/REACH_ENVELOPE.md).
  # Learned backends (GraspGen-X, HUG) already propose angled grasps; this
  # only affects the analytic candidates. A malformed list fails the grasp.
  angled_approach_tilts_deg: []
  # B73 (opt-in with the tilts above; the *_reach profiles set true): vet
  # each tilted ANALYTIC candidate's approach (pregrasp -> grasp, sampled so
  # no point moves more than 1 mm between checks) with the URDF collision
  # hulls of the forearm, wrist, housing and open fingers
  # (assets/grasp_geometry/rebot_rs_clearance_hulls.json) against the support
  # plane (safety.table_z) and the target's observed box; a candidate closer
  # than width_pad_m / 2 (the planner's own jaw clearance) is refused and the
  # next one tried. Decision + reason go to the grasp evidence. Learned and
  # top-down candidates are not vetted here. false = exactly the B45 planner.
  # Measured on the B45 grid: docs/REACH_ENVELOPE.md "Gripper clearance".
  angled_clearance_vet: false
  # Persistence: pick_and_place keeps retrying (re-home, re-scan, fresh
  # grasp plan) until it succeeds or one of these budgets runs out.
  persist_seconds: 120
  max_pick_attempts: 8
  # task_persist_seconds: 180  # whole-TASK cap shared by every dispatch tier
  #                           # (reflex pick, then the LLM's retry of the same
  #                           # call); default 1.5x persist_seconds. Set by the
  #                           # orchestrator via begin_task_budget().
  min_grasp_z_m: 0.008      # learned grasp z a few mm below this above the
                            # table is clamped up (tip-offset overshoot),
                            # not aborted
  # Grasp EXECUTOR (ROADMAP mid term "VLA policy backend", B49) -- OPT-IN.
  # `analytic` = everything above: localize -> plan (backend) -> select ->
  # vetted approach/descent/close/lift; byte-identical to before B49.
  # `vla` (or CASCADE_GRASP_EXECUTOR=vla) = grasp_object(label), and every
  # composite that grasps by label, is served by a language-conditioned
  # policy over the openpi / LingBot-VLA-v2 websocket protocol
  # (grasping/vla_executor.py; `vla` extra: websockets + msgpack). Same
  # localization; jaws open and re-home like the analytic path; then each
  # action chunk is admitted WHOLE by the SafetyHarness (vet_pose, no grasp
  # exemption) and streamed waypoint by waypoint through SafeArm.move_joints
  # (approve() on every sample). Stop latch/halts honoured between chunks;
  # chunk and episode deadlines end the episode with no further motion. The
  # server's own success flags are never read: the jaw check and the
  # postcondition verifier judge. No server, no extra, the observed-finger
  # gate or a native motion planner -> the grasp is refused before motion
  # (never an analytic fallback) and the capability matrix withholds the
  # label-grasp tools. Pixel grasps (grasp_at_pixel) stay analytic.
  # Protocol double: scripts/serve_vla_stub.py. See docs/VLA_EXECUTOR.md.
  executor: analytic
  vla:
    host: 127.0.0.1
    port: 8000                # openpi serve_policy default; LingBot uses --port (8006 default).
                              # CASCADE_VLA_PORT overrides it.
    connect_timeout_s: 1.0    # connect + metadata frame; also the startup probe budget
    chunk_timeout_s: 2.0      # one infer round trip; a late chunk ends the episode
    episode_timeout_s: 60.0   # the whole episode (also capped by the task budget)
    max_chunks: 20
    chunks_after_close: 1     # chunks run after the first close command (the lift)
    max_chunk_len: 64         # rows per chunk accepted (LingBot --use_length 25..50)
    action_key: actions       # reply key holding the (H, D) chunk (openpi: actions)
    action_space: joint       # joint = absolute LOCAL joint angles (rad, this arm's
                              # convention) | tcp = base-frame x y z roll pitch yaw (IK)
    gripper: open_frac        # gripper column: 1 = open .. 0 = closed (close_frac flips it)
    gripper_column: null      # null -> the column right after the arm columns
    waypoint_duration_s: 0.2  # per action; SafeArm still stretches for the velocity cap
    prompt: "pick up the {label}"
    image_key: observation/image   # primary camera, RGB uint8, resized square
    state_key: observation/state   # measured joints + jaw opening fraction, float32
    prompt_key: prompt
    image_size: 224           # null -> native resolution
    reset: null               # sent once per episode before the first observation
                              # (LingBot: {reset: true, robo_name: <robot config>})
    extra_obs: {}             # static keys merged into every observation

memory:
  horizon_s: 15.0           # episodic window the agent can consult
  # Vesta memory harness (arXiv:2606.20905 §2.4): how many captioned PAST
  # frames (initial state + sampled actions, each with its physics verdict)
  # the planner sees on every turn, next to the current view. 0 = text-only
  # history -- the configuration Vesta's ablation scores lowest (49.7 vs
  # 75.9 for image+text). Also served to a chat host by the `task_memory`
  # MCP tool. Frames live in their own ring (frames_horizon_s) because a
  # 15 s window would forget the initial state before one pick finished.
  frames_k: 4
  frames_horizon_s: 600.0
  # Persistent spatial memory: the belief store is written on shutdown and
  # reloaded at startup, so the world model survives a restart (the robot does
  # not re-discover a table it already mapped). Everything reloaded is aged
  # past the visible horizon, so it reads as `remembered`, never `visible`.
  # CASCADE_BELIEFS=0 disables it without editing this file.
  persist_beliefs: true
  beliefs_path: null        # null -> <repo>/runs/beliefs.json
  beliefs_max_age_s: 21600  # 6 h; older beliefs are dropped on load
  # Instance-level association: a camera frame's detections are grouped into
  # instances (shared image support) and matched to beliefs ONE-TO-ONE, so
  # two identical props inside the 8 cm fusion gate stay two beliefs. false =
  # the pre-2026-10-08 per-detection fusion, kept as the live A/B baseline
  # (memory/beliefs.py `update_frame`).
  instance_association: true
  # Colour identity per camera (B32b): a belief keeps the colour name EACH
  # camera gave it, and an observation is held to its own camera's name. One
  # object that two cameras name across a hue band boundary (the Isaac bin:
  # H 22 "orange" in the top camera, H 23 "yellow" in the side camera) is then
  # one belief: a camera that never named a belief may fuse a perceptual-
  # neighbour name (orange~yellow) only when the 3D boxes of the two clouds
  # overlap with IoU >= neighbour_colour_iou (so a prop INSIDE the bin stays
  # separate); non-neighbour names (red/blue) never fuse. false = the
  # pre-2026-10-08 one-name rule, kept as the live A/B baseline
  # (memory/beliefs.py `_identity_ok`).
  per_camera_colour: true
  neighbour_colour_iou: 0.75
  # Size consistency in the fusion gate (B40): a camera view much larger than
  # any view a belief has had -- more than 2x its robust horizontal diameter
  # AND more than 5 cm larger -- is not that object. So a camera that names a
  # container and the prop inside it with the SAME colour (the Isaac side
  # camera's "yellow" bin and a yellow cube in it) no longer fuses its view of
  # the container into the prop's belief. A smaller view always passes (a
  # partial or occluded view only looks smaller), and a view or belief without
  # a real-mask cloud is never refused. Both numbers are CPU estimates from the
  # live clouds (docs/evidence/b40-fusion-size-gate-20261009/); the live A/B
  # is owed. false = the pre-2026-10-09 store, byte for byte, kept as the live
  # A/B baseline (memory/beliefs.py `_size_ok`).
  size_gate: true
  # ASPIRE skill library (skills_library/*.md, written offline by
  # scripts/learn_from_runs.py): a distilled note is retrieved into the agent
  # context only after it recurred in this many DISTINCT tasks (upstream
  # ASPIRE's promotion rule). Notes seen in one task stay stored candidates.
  # 1 = retrieve after a single confirmed retry -- an explicit relaxation, not
  # a default. Must be >= 1.
  skill_min_tasks: 2
  # Memory embedder (ROADMAP #7, opt-in; memory/embedder.py). `none` = the
  # memory exactly as before: no embedding index, guard-word skill notes.
  # `hash` = deterministic, dependency-free colour/layout image vectors and
  # hashed-word text vectors: image->image recall of frames and localized
  # object crops, embedding-ranked skill notes, but NO text->image recall.
  # `siglip` | `clip` = a real image-text model through the `memory-embed`
  # extra (+ host torch): adds recall_memory's "looks like <query>" hits. A
  # backend that is requested but cannot load fails the runtime build -- it
  # never falls back silently. CASCADE_MEMORY_EMBEDDER (backend) and
  # CASCADE_MEMORY_EMBEDDER_MODEL override this block. Advisory only.
  embedder:
    backend: none
    model: null               # null -> the backend's default checkpoint
    device: auto
    local_files_only: true    # never downloads weights unless set to false
  # Visual recall v2 (B43, ROADMAP #7; both opt-in, both need the embedder
  # above -- without one they are reported at startup and ignored).
  # visual_recall_detections: the WorldWatcher also remembers what each
  # COMMITTED detection looked like, not only the objects a call localized:
  # one crop per belief per frame, at most one per belief every
  # visual_recall_interval_s, at most visual_recall_max_per_tick per watcher
  # tick, in a ring of its own (visual_recall_max_detections, frames_horizon_s)
  # so it never evicts motion frames or localized crops. Fusion is paused
  # while the arm moves, so a motion frame never yields a crop. A bad limit
  # fails the build. false = the B21 index exactly.
  visual_recall_detections: false
  visual_recall_interval_s: 30.0
  visual_recall_max_per_tick: 2
  visual_recall_max_detections: 128
  # persist_episodic: the visual index (frames, localized and watcher crops)
  # is written on shutdown and reloaded at startup, like persist_beliefs:
  # wall-clock ages, entries older than episodic_max_age_s dropped, every
  # restored hit marked restored/remembered and at least 2 s old -- never a
  # current observation. A file from another embedder is refused (its vectors
  # are not comparable). CASCADE_EPISODIC=1/0 overrides this switch;
  # CASCADE_EPISODIC_PATH relocates the file. false = in-process only.
  persist_episodic: false
  episodic_path: null       # null -> <repo>/runs/episodic.json
  episodic_max_age_s: 21600 # 6 h, like beliefs_max_age_s
  # Action<->object consolidation of tier-2 outcomes (ROADMAP #7, opt-in;
  # memory/consolidation.py): wins/losses per (skill, object) across
  # instruction wordings, persisted to runs/action_objects.json and shown to
  # the LLM tier as advisory history for the objects a task names.
  action_objects: false

# Tier-3 planner knobs (agent/orchestrator.py).
agent:
  # Pre-motion plausibility critic (Human-CLAW, ROADMAP follow-up #6): before
  # the planner's motion call is dispatched, the configured VLM is shown the
  # current frame and the belief digest and asked a skill-specific question --
  # is THIS call with THESE args plausible given what is visible, reachable
  # and held? ADVISORY ONLY: the answer rides on the result and the trace row
  # as `plausibility: {verdict, reasons, source}` and an `implausible` verdict
  # is a caution the planner reads on its next turn. It never refuses, delays
  # beyond its budget or alters the call -- the safety harness is the sole
  # authority that refuses motion. Reflex/experience tiers stay LLM-free.
  # false (or CASCADE_PREMOTION_CHECK=0) reproduces the pre-critic path
  # exactly: no VLM turn, no extra keys.
  premotion_check: true
  premotion_max_checks: 3   # VLM turns per task (booth clock); beyond it the
                            # result records `skipped` and the motion runs
  # Programs tier (Waddle "programs", ROADMAP follow-up #8; design note
  # docs/PROGRAMS_TIER.md). OFF by default. When on, a task that no reflex or
  # habit plan covers first gets ONE authoring turn: the brain writes a bounded
  # list of registered tool calls (object labels as parameters, positions only
  # as localize_object(label)+offset queries re-grounded before the first
  # motion) or reuses a PROMOTED program, and the orchestrator runs it step by
  # step through SkillRuntime.execute() -- the harness still vets every motion
  # and every step keeps its own postcondition. The first failed, refused or
  # unverified step stops it and hands the task to the LLM tier with a
  # next_action. A program is stored only from a fully CONFIRMED execution and
  # offered for reuse only after it was verified in program_min_tasks distinct
  # tasks (1 = explicit relaxation). CASCADE_PROGRAMS=1/0 overrides; store:
  # runs/programs.jsonl (memory.programs_path, CASCADE_PROGRAMS_PATH). The
  # CLI's mock brain never gets it. The SAME switch gives an arm MCP server
  # two more tools for chat hosts (B42): list_programs (promoted programs
  # only) and run_program (a promoted program by name, or a host-written spec
  # run once and stored as a candidate only if every effect was CONFIRMED),
  # through the same runner and admission rule; a cancel mid-program latches
  # the e-stop. With memory.embedder set, programs are ranked by text
  # embedding (floor-or-guard, like the skill-library notes) instead of
  # keyword overlap. false = the pre-tier CLI and MCP server exactly.
  programs: false
  program_min_tasks: 2

# Always-on perception: every rig camera feeds the belief store continuously
# so commands resolve against an already-warm world model.
perception_loop:
  enabled: true
  rate_hz: 3.0              # detector passes per second across the rig
  belief_fallback_age_s: 3.0  # grasp-from-memory allowed if the object was
                              # seen this recently BEFORE the motion started
  localize_frames: 3        # detector passes per localize before falling
                            # back to the belief store (single frames flicker)

# Browser dashboard (stdlib HTTP). HEADLESS BY DEFAULT: the chat client
# (Hermes / OpenClaw / any MCP host) is the interface, and this view is a
# diagnostic surface you attach when a human wants to look.
#
#   mode: lazy   nothing binds until open_live_view / live_view_url is called;
#                auto-closes after idle_timeout_s with nobody watching
#   mode: eager  bind at startup (booth: the big screen must be live)
#   mode: off    never bind
#
# CASCADE_STREAM overrides this (0/off = hard kill switch, honoured by tests).
stream:
  mode: lazy
  idle_timeout_s: 900       # 15 min of no browser activity -> auto-close
  host: 0.0.0.0
  port: 8090
  fps: 15
  quality: 80
  depth_max_m: 2.0          # depth-view colormap range (tabletop scale)
  # B47 "what the gripper sees" (opt-in). true + a camera whose profile is a
  # wrist view (`role: wrist` or eye-in-hand extrinsics, e.g. mujoco_wrist /
  # isaac_wrist / d455f_wrist): while a motion skill runs the dashboard
  # highlights THAT tile and captions it with one line built only from
  # verifiable state -- skill + target, the runtime's held-state, and the
  # three-state postcondition once it exists (a hold reads "unverified" unless
  # grasp_object's own verdict covers it). /state and the MCP world state gain
  # `wrist_view`. No wrist camera = no panel (a front view is never shown as
  # the gripper's). false = the exact pre-B47 dashboard and state.
  wrist_narration: false

# MCP server front-end (apps/mcp_server.py, chat hosts).
mcp:
  # Read-only lane (B46). OFF by default: the server answers one tool call at
  # a time -- stops, cancels and pings are always handled out-of-band, but a
  # world_state sent mid-pick waits for the pick. On, a world_state,
  # robot_knowledge, verify_last_action or camera_snapshot call that arrives
  # while a motion tool (or run_program) runs is answered at once on a
  # separate lane thread, and its result carries `served_during_motion`
  # (state may be in flux). Motions stay strictly serialized, every other tool
  # still waits, a lane call can never delay a stop, and lane calls never
  # enter SkillRuntime.execute() or take the execution lock (camera_snapshot
  # reads the stream passively: no last_frame write, no depth filling).
  # CASCADE_MCP_READONLY_LANE=1/0 overrides. false = the serial server exactly.
  readonly_lane: false

# Local cv2 window (RigViewer). One row per camera, RGB beside its depth
# colormap so a depth sensor is never silently shown as RGB-only.
# --no-view / CASCADE_VIEW=0 still disables the window entirely.
viewer:
  show_depth: true
  # depth_max_m defaults to stream.depth_max_m so both views agree.

# Verify each motion primitive's physical effect against a channel the
# actuator does not own (sim physics truth, else the belief store).
verify_effects: true

detector:
  # Open-vocabulary YOLO (YOLOE / YOLO-World). Ultralytics auto-downloads
  # the weights into ${repo}/models on first use if absent, so the demo is
  # object-agnostic out of the box (any visitor object localizes by name).
  # Override with $CASCADE_DETECTOR_MODEL for a hand-tuned checkpoint.
  type: yoloe
  model: ${repo}/models/yoloe-11s-seg.pt
  # `auto` probes the host at startup: CUDA/ROCm, else Apple MPS, else CPU.
  # Pin an explicit device (cuda:1, cpu, mps) only to override that choice --
  # an explicit device that this host does not have degrades to the best
  # available one with a warning rather than failing the run. CASCADE_DEVICE
  # overrides every profile at once (see cascade/device.py).
  device: auto
  conf: 0.25
  # Prompt-free: run YOLOE's built-in vocabulary instead of a fixed class
  # list. This is what makes the booth genuinely object-agnostic -- a visitor
  # can put ANYTHING on the table and it enters the world model without
  # having been named in advance. Set false only for a task that really is
  # "find these specific things"; it turns perception into a closed set.
  prompt_free: true

# Optional vocabulary restriction for the always-on watcher and
# get_observation. LEAVE EMPTY for a public demo: a non-empty list makes
# perception a CLOSED SET and any object not named here is invisible to the
# whole system, however clearly the camera sees it. Populate it only for a
# controlled benchmark where the object set is known and fixed.
detect_classes: []

# Learned point segmenter for `grasp_at_pixel`. It is what makes pixel
# addressing work on a tabletop: depth connectivity cannot separate an object
# from the surface it rests on, and measured on a LIBERO frame against MuJoCo
# body poses it errs by 34 cm, while SAM2.1 with the same point prompt lands
# the bowl at 3.0 cm and the plate at 0.9 cm.
#
# SAM2.1-t is the default on measured grounds, not availability. With access
# to facebook/sam3 granted, both were scored on the same frame and pixels:
#
#   model              bowl      plate     latency   size
#   sam2.1_t.pt        3.0 cm    0.9 cm     60 ms     74 MB
#   sam3.pt            3.0 cm    1.1 cm    982 ms    3.29 GB
#
# SAM3 is no more accurate for POINT prompts here and costs 16x the latency;
# a second per grasp is the whole interaction budget when a visitor is waiting.
# Set `model: sam3.pt` to switch (it needs `timm` and a gated HF download).
# SAM3's real advantage is concept/text prompting and video tracking, so it
# becomes worth its size only when this path stops being point-only.
# SAM3 use in a publication must acknowledge SAM (SAM License 1.b.ii).
segmenter:
  enabled: true
  model: sam2.1_t.pt   # tiny, 74 MB: smallest that separates tabletop objects
  device: auto         # see detector.device above

# Geometric gate on detections, applied AFTER lifting a mask to 3D. It is
# what makes an open vocabulary usable: a ~4.5k-concept detector correctly
# names the arm ("transformer", "amplifier") and the scene ("studio shot"),
# and those must not enter the world model as graspable objects.
# Every value describes the RIG, never the objects, so it stays valid for
# objects nobody has seen before.
workspace_filter:
  base_radius_m: 0.12    # cylinder around the arm's own base, excluded
  base_height_m: 0.50    # how far up that cylinder reaches
  max_extent_m: 0.35     # bigger than this is furniture, not a manipuland
  min_extent_m: 0.015    # smaller than this is a depth speck
  table_z_m: -0.05       # below this is under the table
  max_z_m: 0.60          # above this is backdrop, not tabletop
  reach_m: 1.00          # beyond this the arm cannot act anyway
  max_frame_frac: 0.45   # a mask this large IS the scene
  min_height_m: 0.010    # flatter than this is a shadow, not an object
  # Frames that carry a render self-mask (Isaac with CASCADE_ISAAC_PIXEL_MASK=1,
  # which launch.sh sets): a detection more than this fraction robot pixels IS
  # the robot, wherever it is; below it the robot's pixels are not lifted to 3D.
  # Measured on Isaac: robot detections 0.885-0.995, props <= 0.046 (B32).
  # self_mask: false is the A/B baseline.
  self_mask: true
  self_mask_max_frac: 0.5
  # Frames WITHOUT a render self-mask (the real rig): build the robot's pixels
  # from the arm's URDF link geometry instead (B39, perception/link_mask.py),
  # posed by FK at the joint sample nearest the frame's capture time, and feed
  # the same gate. Opt-in; false is byte-identical to the gate without it.
  # Off whenever self_mask is false; a render mask is never overwritten.
  #   dilate_px   pixels added around the silhouette (calibration slack)
  #   max_skew_s  no joint sample this close to the frame -> NO mask (logged)
  #   cell_m      mesh pieces (link-frame cells); smaller = tighter, slower
  #   capsule_radius_m  for a link whose mesh cannot be read (default: the
  #               arm profile's body_mask_radius_m)
  link_self_mask:
    enabled: false
    dilate_px: 2
    max_skew_s: 0.15
    cell_m: 0.05

# Offline evaluation of recorded runs (src/cascade/eval, scripts/judge_run.py).
# Robo-Dopamine GRM ("PRM-as-a-Judge", https://robo-dopamine.github.io/):
# scores each traced skill's BEFORE->AFTER keyframes as a progress hop in
# [-1, 1] and fuses them into a run progress curve; judge_run.py cross-checks
# every hop against the physics postcondition channel, so the judge is
# CALIBRATED on this rig before its number is quoted. Never in the control
# loop; no silent default -- pick a backend:
#   grm   the released GRM-2.0 checkpoint behind vLLM's OpenAI server (CUDA):
#         vllm serve tanhuajie2001/Robo-Dopamine-GRM-2.0-8B-Preview \
#              --served-model-name grm --limit-mm-per-prompt image=8
#   vlm   the same prompt against any OpenAI-compatible vision model (local
#         Cosmos3 server, GPT, the OpenClaw brain) -- upstream's own API
#         comparison path; the only one that runs on a GPU-less laptop.
#   fake  deterministic, tests only.
#   The default below goes THROUGH the OpenClaw gateway's OpenAI-compatible
#   endpoint (enable once: `openclaw config set
#   gateway.http.endpoints.chatCompletions.enabled true`), so the judge uses
#   the same credentials as the demo's brain -- no second API key on the
#   booth laptop. `backend_model` pins the weights (x-openclaw-model) and
#   `fresh_session` isolates every BEFORE/AFTER pair from agent history.
# Launcher judge pass (B44, opt-in, advisory): `scripts/launch.sh --judge
#   fake|vlm|grm` (or CASCADE_JUDGE; default off = no judge process) runs
#   judge_run.py over the proof turn's pick_and_place keyframes AFTER the
#   physics proof, with this section's settings (or the complete JSON in
#   CASCADE_JUDGE_CONFIG) and the backend from --judge, under a hard bound
#   CASCADE_JUDGE_TIMEOUT_S (default 180 s, max 1800; the judge's process
#   group is killed at the bound). The judge-vs-physics confusion matrix
#   lands in <state>/<proof-session>/run-summary.json plus one banner line.
#   It never changes READY, proof.json or the exit status; a failure reads
#   "unavailable". `--judge vlm` with the section below calls the gateway's
#   frontier model -- for the local brain point CASCADE_JUDGE_CONFIG at a
#   JSON like deploy/runtime/runtime.py writes (base_url of the local
#   OpenAI-compatible server, model id, extra_body enable_thinking: false).
eval:
  judge:
    backend: vlm
    base_url: http://127.0.0.1:18789/v1
    api_key: $OPENCLAW_GATEWAY_TOKEN   # $VAR = read from the environment (scripts/judge_run.py fills it from ~/.openclaw)
    model: openclaw/main               # gateway agent target
    backend_model: openai/gpt-5.6-sol  # the vision model that actually answers
    fresh_session: true
    mode: incremental                  # incremental | forward | backward (upstream fusion modes)
    temperature: 0.1                   # upstream sampling for GRM
    top_p: 0.9
    max_tokens: 64
    # B66 (opt-in): an answer that ends without a parseable <score> (a local VLM
    # reasoning past max_tokens -- Qwen3.8-27B did on 12 of 72 recorded live
    # picks at 1536) gets ONE follow-up call asking for the score line alone,
    # within this many tokens (1..512; 0 = off: one call per step, as before).
    # judge.json names score_via first|follow-up|none per step and the follow-up's
    # tokens; a follow-up without a score leaves the step unscored, never 0.
    score_followup_tokens: 0

# Conversation service (cascade-conversation) is configured by its own versioned
# JSON, not by this file (docs/CONVERSATION.md). Its `robot_endpoint` +
# `robot_token_env` (B51) select the split deployment: the robot runtime runs in
# `cascade-robot-service` (protocol cascade.robot-runtime/1, loopback only,
# bearer token, supervision lease whose expiry latches the robot stop) and the
# conversation process builds no robot. Absent (default) = the robot runtime is
# built in-process exactly as before. Example: configs/conversation/remote_robot.json.
# Off loopback (B71, opt-in) the robot service needs --tls-cert/--tls-key (it
# refuses a non-loopback --host without them) and the conversation JSON then
# takes `robot_endpoint: https://<host>:<port>` with `robot_tls_ca` (the only CA
# trusted, hostname checked) and/or `robot_tls_fingerprint` (the server
# certificate's SHA-256); both absent = plaintext loopback, byte-identical.
# scripts/robot_endpoint_certs.py issues the CA + certificate. Example:
# configs/conversation/remote_robot_tls.json.
