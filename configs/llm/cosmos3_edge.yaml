# NVIDIA Cosmos3-Edge (4B) behind a vLLM-Omni OpenAI-compatible endpoint.
#
# Cosmos3 is an omnimodal world model for Physical AI (Mixture-of-Transformers:
# autoregressive text tower + diffusion tower for image/video/action). The Edge
# checkpoint is BF16 ~8.6 GB, so it coexists with Isaac Sim on one GPU where
# the Qwen3-VL Q4_K_M path (~18 GB + mmproj) is a tighter squeeze.
#
# Start it with scripts/serve_cosmos3_edge.sh (docker vllm/vllm-omni:cosmos3).
#
# type MUST be `cosmos3`, not `openai_compat`: the model emits XML
# <tool_call><function=...> blocks rather than OpenAI JSON tool_calls. Under
# the plain openai_compat client every turn parses as prose and the agent
# never calls a single skill.
type: cosmos3
base_url: http://127.0.0.1:8000/v1
model: nvidia/Cosmos3-Edge
api_key: EMPTY
supports_vision: true      # native multimodal: no separate mmproj projector
temperature: 0.2
enable_thinking: false     # template default is true; a reasoning preamble
                           # costs seconds per turn on a booth clock
max_frames: 1              # >1 attaches a short clip (reasoner takes ~4 fps
                           # video) so the model can see motion, not one still
