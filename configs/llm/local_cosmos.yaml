# Local backend on the Jetson Thor: NVIDIA Cosmos3-Edge Reasoner (2.44B MoT)
# behind vLLM's OpenAI-compatible server. Start it with
# scripts/serve_cosmos_vllm.sh. KEEP IN SYNC: vLLM rejects a model-name
# mismatch — `model:` below must match the serve script's SERVED_NAME.
# Thinking is disabled for interactive robot commands: long reasoning can
# exhaust the response budget before the model produces a tool call.
#
# The legacy in-process dashboard uses the Cosmos adapter, which accepts both
# native OpenAI tool_calls and Cosmos XML text and validates argument types.
# The OpenClaw host uses native tool_calls directly through its local provider;
# scripts/demo_proof.py --probe-native verifies that serving contract without
# executing a tool. Keep vLLM's parser and derived chat template enabled.
type: cosmos3
base_url: http://127.0.0.1:8082/v1
model: cosmos3-edge
api_key: EMPTY
supports_vision: true
# Use the same local vision model to locate objects missed by YOLOE.
grounding_fallback: true
temperature: 0.2
enable_thinking: false
request_timeout_s: 45.0   # fail a stalled request instead of holding the dashboard
max_retries: 0            # no automatic transport retries during robot commands
max_frames: 1             # >1 attaches a short clip (the reasoner takes ~4 fps
                          # video) so the model can see motion, not one still
