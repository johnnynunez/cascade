# Local backend on the DGX Spark: Qwen3.8-27B (unified VLM) behind an
# OpenAI-compatible server. Start it with scripts/serve_qwen_llamacpp.sh
# (vision via the mmproj projector) or scripts/serve_qwen_vllm.sh (native).
# llama.cpp ignores the request's model name, but vLLM rejects a mismatch:
# `model:` must be one of serve_qwen_vllm.sh's served names (tests/test_qwen_vllm.py).
type: openai_compat
base_url: http://127.0.0.1:8080/v1
model: Qwen/Qwen3.8-27B
api_key: EMPTY
supports_vision: true     # Qwen3.8 is a unified VLM
temperature: 0.2
