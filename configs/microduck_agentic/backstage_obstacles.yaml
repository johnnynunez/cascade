# Single MicroDuck crosses a backstage area with equipment to a green marker.
version: 1
name: backstage_obstacles
title: "Backstage: reach the green marker without touching equipment"
scene: demo/microduck_agentic/backstage_obstacles.usda
bounds: [-0.6, -1.1, 3.2, 1.1]
floor_z: 0.0
settle_s: 1.0
max_sim_s: 150
max_steps: 40
context: >-
  Scene: a backstage corridor about 3.5 m long and 2 m wide with low walls, flight cases, a yellow cable reel and a
  speaker box on the floor. Tools that hand control to a learned policy report what happened; check the receipt.
robots:
  - name: duck_a
    spawn: {x: 0.0, y: 0.0, yaw_deg: 0}
    task: >-
      Reach the green marker at the far end of the backstage area (a green pad with a green post, roughly 2.6 m ahead
      and slightly to the left of your start) without touching any equipment, and stop within 0.35 m of the pad
      centre. Think about which controller fits each part of the route.
verify:
  # no_contact: fails on a possible contact (recorded body origins within 3 cm of an obstacle box)
  duck_a: {type: reach, x: 2.6, y: 0.2, radius: 0.35, no_contact: true}
render:
  overview: {eye: [-0.9, -2.2, 1.9], target: [1.3, 0.0, 0.0]}
  follow: {distance: 0.9, height: 0.55}
