# Optional humanoid fastening fixture: a Unitree G1 (29 DoF + Dex3 hands, the
# newton-assets MJCF) holds a vertical hex driver from above with a three-finger
# contact grasp (thumb opposing index + middle, no weld) and tightens the
# pre-engaged Factory M20 nut by turning the hand about the driver axis with the
# whole arm, re-gripping between strokes. Same fastening.turn_screw tool and
# unchanged FasteningDomain verifier as factory_m20_mounted. Simplifications
# (pelvis fixed, no robot link collisions except the right hand, gravity-
# compensation feed-forward, driver pre-engaged) and results: docs/HUMANOID_FASTENING.md.
#
# Discovery is passive. Build refuses until an owned preparation pins the exact
# model identity and selects an explicit CUDA device; neither grants admission.
# robot_asset: the newton-assets unitree_g1 folder (newton.utils.download_asset("unitree_g1"),
# commit f8fb7abc) placed at assets/mjcf/unitree_g1 (gitignored, like the SO-101 MJCF).
version: 1
robot_id: unitree_g1_29dof_dex3_wrist_driver
domains:
  fastening:
    kind: fastening
    recipe: g1_wrist_driver_m20_v1
    assets: ${assets}/factory/nut_bolt
    robot_asset: ${assets}/mjcf/unitree_g1/mjcf/g1_29dof_with_hand_rev_1_0.xml
    device: null
    model_identity_sha256: null
    gc_policy: freeze-startup-heap
