version: 1
robot_id: mixed_mock
domains:
  manipulation:
    kind: manipulation
    offline: true
    arms: [so101_mock]
    cameras: [mock_small]
  locomotion:
    kind: locomotion
    bases: [microduck_mock]
  sensing:
    kind: sensors
    providers:
      - id: imu
        kind: synthetic
        modality: imu
        frame_id: mixed_mock/base
        values:
          angular_velocity_rad_s: [0.0, 0.0, 0.0]
          linear_acceleration_m_s2: [0.0, 0.0, 9.81]
