# CASCADE submits quintic trajectories to this effort JTC; libfranka runs at 1 kHz.
/controller_manager:
  ros__parameters:
    update_rate: 1000
    thread_priority: 97
    # Match franka_bringup: libfranka's blocking 1 kHz read paces the loop;
    # skipping missed periods adds sleeps that can trigger an FCI reflex.
    overruns:
      manage: false
      print_warnings: true
    # Receive each cycle from libfranka instead of sleeping on a second timer.
    hardware_synchronization:
      expect_blocking_read_write: true
    fr3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

/fr3_arm_controller:
  ros__parameters:
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4,
             fr3_joint5, fr3_joint6, fr3_joint7]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    gains:
      fr3_joint1: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint2: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint3: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint4: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint5: {p: 250.0, d: 10.0, i: 0.0, i_clamp: 1.0}
      fr3_joint6: {p: 150.0, d: 10.0, i: 0.0, i_clamp: 1.0}
      # Recorded joint7 steady error ~0.025 rad at ~1.25 Nm prevented
      # settling within 0.02 rad. Add bounded bias correction; retain P/D.
      fr3_joint7:
        p: 50.0
        d: 5.0
        i: 10.0
        i_clamp_max: 1.0
        i_clamp_min: -1.0
        antiwindup_strategy: conditional_integration

/franka_robot_state_broadcaster:
  ros__parameters:
    robot_type: fr3
    convenience_publish_rate: 100
