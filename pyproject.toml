[project]
name = "cascade"
version = "0.1.0"
description = "CASCADE: a hardware-agnostic framework for cascaded reflex/habit/LLM agentic manipulation -- pluggable arms, cameras, and LLM backends behind one curated skill API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Johnny Nunez" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Perception extras (open-vocabulary detection). torch comes from the host env
# on purpose: the right build is per-platform (CUDA, ROCm, Jetson wheels, MPS,
# CPU) and pinning one here would fight the host. See cascade/device.py.
perception = ["ultralytics>=8.3"]
# LLM backends. The OpenAI client also covers llama.cpp / vLLM local servers
# and any OpenAI-compatible gateway (Nous Portal -- see configs/llm/hermes.yaml).
llm = ["openai>=1.50", "anthropic>=0.40"]
# Kinematics (FK/IK on the arm URDF).
kinematics = ["pin>=3.0"]
# Real arm transports, one extra per bus. Separate because they share nothing:
# a Feetech-servo arm has no use for SocketCAN and vice versa.
arm = ["motorbridge>=0.4.9"]              # RobStride over SocketCAN (reBot B601)
arm-feetech = ["pyserial>=3.5"]           # Feetech STS/SCS servo bus (SO-101)
# Hardware-free physics for any MJCF robot (cascade/control/mujoco_arm.py).
# Runs on CPU anywhere, so it is the portable alternative to Isaac Sim.
sim = ["mujoco>=3.1.3"]
# MuJoCo Warp: the same MJCF on the GPU-optimized runtime (Newton project).
# `engine: warp` in an arm profile selects it; CUDA accelerates it, and Warp's
# CPU fallback keeps the path developable on a laptop. Additive to `sim`, never
# a replacement -- the C engine stays the fast default for a single arm.
sim-warp = ["mujoco>=3.1.3", "mujoco-warp>=3.1", "warp-lang>=1.7"]
# GraspGen-X / nvblox CLIENT side: the ZMQ + msgpack wire only. The heavy
# model stacks live in their own venvs and processes (scripts/serve_*.sh), so
# cascade never imports torch for them. Without this extra
# `grasp.backend: graspgenx` -- the DEFAULT in configs/demo.yaml -- cannot even
# build its client and silently degrades to the OBB planner on every grasp.
grasping = ["pyzmq>=25.0", "msgpack>=1.0", "msgpack-numpy>=0.4.8"]
# Occupancy bridge, hardware-agnostic backend: Warp kernels (CPU anywhere,
# CUDA where present) + scipy (reference EDT / fallback). Small enough to
# live in the default one-click install; nvblox_torch (CUDA x86 only) is
# added by scripts/install_occupancy_backend.sh --nvblox on NVIDIA boxes.
occupancy = ["pyzmq>=25.0", "msgpack>=1.0", "msgpack-numpy>=0.4.8", "warp-lang>=1.16", "scipy>=1.10"]
dev = ["pytest>=8.0"]

[project.scripts]
cascade = "cascade.apps.demo:main"
cascade-record = "cascade.apps.record:main"
cascade-mcp = "cascade.apps.mcp_server:main"
cascade-view = "cascade.apps.viewer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests that need a live camera/arm (deselected by default)",
]
addopts = "-m 'not hardware'"
