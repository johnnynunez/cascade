[project]
name = "cascade"
version = "0.1.0"
description = "CASCADE: a hardware-agnostic framework for cascaded reflex/habit/LLM agentic manipulation -- pluggable arms, cameras, and LLM backends behind one curated skill API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Johnny Nunez" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Perception extras (open-vocabulary detection). torch comes from the host env.
perception = ["ultralytics>=8.3"]
# LLM backends. The OpenAI client also covers llama.cpp / vLLM local servers.
llm = ["openai>=1.50", "anthropic>=0.40"]
# Kinematics (FK/IK on the arm URDF).
kinematics = ["pin>=3.0"]
# Real arm transport (RobStride over SocketCAN).
arm = ["motorbridge>=0.4.9"]
dev = ["pytest>=8.0"]

[project.scripts]
cascade = "cascade.apps.demo:main"
cascade-record = "cascade.apps.record:main"
cascade-mcp = "cascade.apps.mcp_server:main"
cascade-view = "cascade.apps.viewer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests that need a live camera/arm (deselected by default)",
]
addopts = "-m 'not hardware'"
